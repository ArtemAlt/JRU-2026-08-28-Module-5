app:
  greeting:
    message: "Welcome"
    count: 3
    enabled: true
    services:
      - service1.url.com
      - service2.url.com
      - service3.url.com
    properties:
      prop1: Welcome
      prop2: 5
      prop: prpos
      val: some
  jdbc: true
  user:
    admin: "admin"
  name: "My-App"
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb
    username: ${DB_USER:admin}
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: dev
logging:
  level:
    org.hibernate.SQL: DEBUG
server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: "string-secret-at-least-256-bits-long"
  access-token-validity-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, prometheus
  endpoint:
    health:
      show-details: always
    env:
      show-values: always
    metrics:
      enabled: true
